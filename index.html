    <script>
      (function() {
        try {
          // Dynamic Canonical & OG URL resolution
          if (window.location && window.location.origin) {
            var fullUrl = window.location.origin + window.location.pathname;
            var canLink = document.getElementById('canonical-url');
            if (canLink) canLink.setAttribute('href', fullUrl);
            var ogUrl = document.getElementById('og-url');
            if (ogUrl) ogUrl.setAttribute('content', fullUrl);
            var twUrl = document.getElementById('twitter-url');
            if (twUrl) twUrl.setAttribute('content', fullUrl);
            var ogImg = document.getElementById('og-image');
            if (ogImg && !ogImg.getAttribute('content').startsWith('http')) {
              ogImg.setAttribute('content', window.location.origin + '/og-image.jpg');
            }
            var ogSec = document.getElementById('og-image-secure');
            if (ogSec && !ogSec.getAttribute('content').startsWith('http')) {
              ogSec.setAttribute('content', window.location.origin + '/og-image.jpg');
            }
            var twImg = document.getElementById('twitter-image');
            if (twImg && !twImg.getAttribute('content').startsWith('http')) {
              twImg.setAttribute('content', window.location.origin + '/og-image.jpg');
            }
          }

          var saved = localStorage.getItem('heaven_theme');
          var isDark = saved ? saved === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
